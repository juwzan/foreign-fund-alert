# 평일 오전/오후 하루 2회 금감원 "외국인 증권투자 동향" 게시판을 확인해 신규 글이 있으면
# 메일로 알린다. 게시판 자체는 월 1회만 올라오므로 하루 2회 체크로 충분히 여유 있음.
name: Check New FSS Post

on:
  schedule:
    - cron: '0 0,6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python scripts/main.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report/state.json
          git diff --cached --quiet || git commit -m "chore: update last-seen post ($(date +'%Y-%m-%d %H:%M'))"
          git push
